'氣墊床':'用於協助壓力分散，須依風險與照顧需求選擇，不能取代翻身與皮膚觀察。',

'便盆椅':'提供床邊如廁選擇，須注意煞車、移位空間與清潔。',

};

function roomPage(){let r=room();let bath=r.id==='bath';return `<h2 class="heading">${e(r.name)}</h2><p class="intro">點擊圖片上的區域或下方按鈕，進入設備周邊的輔具情境。</p><div class="layout"><div class="surface">${bath?`<div class="hero"><img src="${photo}" alt="擬真無障礙浴室，包含淋浴椅、馬桶、扶手與洗手台"><span class="scene-label">浴室 · 改善後示意</span><div class="overlay"><button class="zone" style="left:28%;top:48%" onclick="goZone(1)">淋浴間 ＋</button><button class="zone" style="left:70%;top:55%" onclick="goZone(0)">馬桶 ＋</button><button class="zone" style="left:88%;top:78%" onclick="goZone(2)">洗手台 ＋</button></div></div>`:placeholder(r)}<div class="zones">${r.zones.map((z,i)=>`<button onclick="goZone(${i})">${e(z[0])} →</button>`).join('')}</div></div><aside class="surface side"><h3>探索 ${e(r.name)}</h3><p>選擇想了解的設備。每個設備會列出相關輔具，並說明用途及使用注意事項。</p>${r.zones.map((z,i)=>`<button class="btn" style="display:block;width:100%;text-align:left;margin:8px 0" onclick="goZone(${i})">${e(z[0])} · ${z.length-1} 項 →</button>`).join('')}<div class="hint" style="margin-top:16px">輔具是否適合使用，仍須依身體功能、環境及專業評估決定。</div></aside></div>`}
function placeholder(r){return `<div class="placeholder"><svg viewBox="0 0 520 360" aria-label="${e(r.name)}空間配置示意"><rect x="20" y="20" width="480" height="320" rx="15" fill="#eee7dd" stroke="#c3ad93" stroke-width="7"/><path d="M20 20L85 80M500 20L435 80" stroke="#fffaf0" stroke-width="8"/><rect x="65" y="90" width="390" height="200" rx="17" fill="#e6d4bf" stroke="#c6ae8e" stroke-width="4"/><rect x="95" y="116" width="180" height="118" rx="14" fill="#faf7ef" stroke="#c8ad91" stroke-width="5"/><rect x="110" y="126" width="150" height="30" rx="9" fill="#d9c9b6"/><rect x="305" y="125" width="115" height="70" rx="10" fill="#c3b6a5"/><circle cx="363" cy="230" r="26" fill="#a9b5a8"/><text x="260" y="65" text-anchor="middle" fill="#685443" font-size="23" font-weight="bold">${e(r.name)}</text></svg><span>此房間擬真情境圖尚待製作</span></div>`}
function zonePage(){let r=room(),z=r.zones[zoneId],bath=r.id==='bath';let selected=z[aidId+1]||z[1];return `<h2 class="heading">${e(r.name)} · ${e(z[0])}</h2><p class="intro">從設備周邊的照顧情境，認識可能使用的輔具及環境改善。</p><div class="layout"><div class="surface">${bath?`<div class="switches">${zoneId===1?`<button class="${compare==='after'?'on':''}" onclick="compare='after';render()">改善後</button><button class="${compare==='before'?'on':''}" onclick="compare='before';render()">改善前</button>`:''}<button onclick="goBackRoom()">← 回浴室全景</button></div><div class="hero">${compare==='before'&&zoneId===1?`<div class="placeholder before" style="height:430px"><svg viewBox="0 0 520 350"><rect width="520" height="350" fill="#e5ded5"/><path d="M0 170H520M0 250H520" stroke="#b9b0a4" stroke-width="2"/><rect x="70" y="140" width="380" height="155" rx="28" fill="#f8f8f5" stroke="#a9a9a2" stroke-width="9"/><ellipse cx="260" cy="150" rx="190" ry="33" fill="#fafaf8" stroke="#b6b5ae" stroke-width="7"/><path d="M60 298H465" stroke="#a18b76" stroke-width="12"/><text x="260" y="70" text-anchor="middle" fill="#756454" font-size="23">傳統浴缸示意</text></svg><span>改善前：浴缸及跨越高差的概念示意</span></div>`:`<img src="${photo}" alt="浴室擬真情境示意" style="object-position:${zoneId===0?'80%':zoneId===1?'20%':'95%'} center"><span class="scene-label">${e(z[0])} · 改善後情境</span>`}</div>`:`${placeholder(r)}<button class="btn back" onclick="goBackRoom()" style="margin-top:12px">← 回${e(r.name)}</button>`}<div class="feature"><h3>${e(z[0])}可以搭配哪些輔具？</h3><p>點選下方項目，查看使用重點。</p><div class="aidGrid">${z.slice(1).map((a,i)=>`<button class="${aidId===i?'active':''}" onclick="chooseAid(${i})">＋ ${e(a)}</button>`).join('')}</div><div id="detail" class="detail"><h4>${e(selected)}</h4><p>${e(descriptions[selected]||'依個別需求、操作能力與環境條件選擇，實際使用前建議由相關專業人員評估。')}</p><p class="tiny">本頁為衛教示意，非特定產品推薦。補助資格、碼別與給付金額尚待逐項核對。</p></div></div>${bath&&zoneId===1?`<div class="beforecard"><strong>改善前後的比較重點</strong><div>傳統浴缸可能需要跨越較高邊緣；改善後以無門檻淋浴、適當排水、防滑地面及扶手配置為方向。實際工程須評估防水與結構。</div><div class="visualNote">目前「改善前」為概念插圖，尚非與改善後同視角的擬真成對圖片。</div></div>`:''}</div><aside class="surface side"><h3>相關輔具與改善</h3><p>選擇設備後，右側或下方會顯示用途、適用情境及注意事項。</p>${z.slice(1).map((a,i)=>`<button class="btn ${aidId===i?'primary':''}" style="width:100%;text-align:left;margin:5px 0" onclick="chooseAid(${i})">${e(a)}</button>`).join('')}<div class="hint" style="margin-top:15px">後續會串接既有輔具圖鑑，逐項核對補助碼別、金額與使用年限。</div></aside></div>`}
function render(){breadcrumbs();root.innerHTML=page==='home'?`<h2 class="heading">選一個房間，開始探索</h2><p class="intro">一張住宅平面圖，帶你認識家裡不同角落的輔具與無障礙改善。</p>${floorPlan()}`:page==='room'?roomPage():zonePage()}
render();
</script></body></html>
