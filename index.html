const data={toilet:{name:'馬桶',intro:'選擇馬桶周邊的輔具，了解不同支撐與起身方式。',items:[['馬桶增高器','提高坐面高度，可能協助部分使用者坐下與起身；須確認雙腳著地與產品固定。'],['固定式扶手','提供穩定握持位置；應評估牆面承重、固定方式及坐下起身動線。'],['上掀式扶手','可向上收起，適合部分需要側向移位空間的配置；應評估固定結構與承重。'],['馬桶安全扶手架','在馬桶周圍提供握持支撐；需確認尺寸、地面止滑及穩定性。']]},shower:{name:'淋浴間',intro:'以浴缸拆除、乾濕分離及沐浴安全為主，區分環境工程與可移動輔具。',items:[['浴缸拆除','移除原有浴缸並調整淋浴空間；涉及排水、防水與施工評估。'],['乾濕分離隔屏','協助控制濺水範圍；需保留適當通行與照顧操作空間。'],['洗澡椅','提供坐姿沐浴，需確認座高、止滑腳墊、承重及排水。'],['L 型扶手','同時提供水平與垂直握持位置；需依使用者動作能力決定安裝位置。'],['防滑改善','改善濕區滑倒風險，須兼顧地坪坡度、排水及清潔。']]},sink:{name:'洗手台',intro:'探索洗手台周邊支撐與輪椅使用動線。',items:[['環形扶手','提供洗手台周邊握持支撐；需確認安裝結構、位置與使用方式。'],['洗手台下方淨空改善','考量輪椅使用者膝部空間、管線防燙及檯面高度。']]}};
let zone='toilet',selected={toilet:new Set(),shower:new Set(),sink:new Set()},focus=0;const $=id=>document.getElementById(id);function render(){let d=data[zone];$('heading').textContent=d.name+'｜輔具選項';$('intro').textContent=d.intro;document.querySelectorAll('[data-zone]').forEach(b=>{let active=b.dataset.zone===zone;b.classList.toggle('active',active);b.setAttribute('aria-pressed',active?'true':'false')});$('options').replaceChildren();d.items.forEach(([name],i)=>{let b=document.createElement('button');b.className='option';b.setAttribute('aria-pressed',selected[zone].has(name));let check=document.createElement('span');check.className='check';check.textContent=selected[zone].has(name)?'✓':'＋';let label=document.createElement('span');label.textContent=name;b.append(check,label);b.onclick=()=>{if(selected[zone].has(name))selected[zone].delete(name);else selected[zone].add(name);focus=i;render()};$('options').append(b)});$('detailTitle').textContent=d.items[focus][0];$('detailText').textContent=d.items[focus][1];$('status').textContent=selected[zone].size?'已選擇：'+[...selected[zone]].join('、'):'尚未選擇任何項目'}document.querySelectorAll('[data-zone]').forEach(b=>b.onclick=()=>{zone=b.dataset.zone;focus=0;render()});$('clear').onclick=()=>{selected[zone].clear();render()};render();</script></body></html>
