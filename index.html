<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>長照研究室｜無障礙生活實驗室</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f1ea;color:#433e38;font-family:system-ui,'Noto Sans TC',sans-serif}header{padding:16px 22px;background:#fff9f1;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid #e5d9ca}h1{font-size:20px;margin:0}small{color:#8a7867}.wrap{display:grid;grid-template-columns:minmax(0,1fr) 310px;height:calc(100dvh - 75px);min-height:550px}#scene{position:relative;min-height:480px;background:linear-gradient(#e9e4db,#f7f3ec)}canvas{display:block;width:100%;height:100%}aside{background:#fffdf9;border-left:1px solid #e7dbcf;padding:20px;overflow:auto}.rooms{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}button{border:1px solid #d8c5b5;border-radius:11px;background:#fff;padding:10px 12px;color:#624c3b;cursor:pointer;font-weight:600}button:hover,button.active{background:#cf8055;color:white;border-color:#cf8055}.hint{position:absolute;bottom:15px;left:16px;background:#ffffffdc;padding:10px 13px;border-radius:12px;font-size:13px;max-width:390px}.tag{display:inline-block;background:#f7e9d9;padding:5px 9px;border-radius:8px;font-size:12px;color:#8a593b}.info{line-height:1.8;font-size:14px}.info h2{font-size:23px;line-height:1.3;margin-bottom:6px}.muted{color:#88786b}.pill{margin:7px 0;border-left:3px solid #d28a5c;padding:8px 11px;background:#faf2e8}.footer{font-size:12px;color:#8d7e70;margin-top:24px}.overlay{position:absolute;top:16px;left:16px;background:#ffffffdf;padding:9px 12px;border-radius:12px;font-size:13px}a{color:#b66d40}@media(max-width:800px){.wrap{display:block;height:auto}#scene{height:53dvh;min-height:360px}aside{border-left:0;border-top:1px solid #e7dbcf;min-height:350px}header{padding:13px}h1{font-size:17px}.overlay{font-size:12px}.hint{font-size:11px;max-width:75%}}</style></head><body><header><div><h1>無障礙生活實驗室 <span style="color:#d18050">3D</span></h1><small>長照研究室 · 兩房一廳互動住宅原型</small></div><span class="tag">設計與功能驗證版 V0.1</span></header><main class="wrap"><div id="scene"><div class="overlay">拖曳旋轉 · 滾輪／雙指縮放 · 點選橘色輔具</div><div class="hint">模型為程式建立的初版幾何示意，非最終設計師級渲染圖。可切換房間視角並查看輔具資訊。</div></div><aside><strong>房間導覽</strong><div class="rooms" id="rooms"></div><div id="info" class="info"><h2>歡迎來到無障礙住宅</h2><p>這是一間可自由旋轉的兩房一廳示範住宅。點選空間，或直接點擊場景中的橘色輔具。</p><div class="pill">輔具介紹與未來商品資料分離設計，避免將給付碼別誤認為商品型號。</div></div><div class="footer">展示內容僅供初步衛教，非個別輔具評估或補助核定。購物功能尚未啟用。</div></aside></main><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';
const mount=document.getElementById('scene'),scene=new THREE.Scene();scene.background=new THREE.Color('#eee9e0');const camera=new THREE.PerspectiveCamera(42,1,.1,100);camera.position.set(13,13,16);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;mount.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=5;controls.maxDistance=32;controls.maxPolarAngle=Math.PI/2.12;controls.target.set(0,0,0);scene.add(new THREE.HemisphereLight(0xffffff,0xb7a58e,2.4));const sun=new THREE.DirectionalLight(0xffffff,2.7);sun.position.set(-6,13,8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-15;sun.shadow.camera.right=15;sun.shadow.camera.top=15;sun.shadow.camera.bottom=-15;scene.add(sun);
const mat=(c,roughness=.85)=>new THREE.MeshStandardMaterial({color:c,roughness});const M={floor:mat('#eadbc8'),wall:mat('#f9f7f1'),wood:mat('#bc916c'),white:mat('#faf9f4'),grey:mat('#b5b9b8'),orange:mat('#d87e49'),sage:mat('#a5b8a0'),blue:mat('#9caebd'),dark:mat('#656c6a'),bath:mat('#d9e6e4'),fabric:mat('#d9c8b8')};const clickable=[];
function box(x,y,z,w,h,d,m,group=scene){let a=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);a.position.set(x,y,z);a.castShadow=true;a.receiveShadow=true;group.add(a);return a}function cyl(x,y,z,r,h,m,group=scene){let a=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,14),m);a.position.set(x,y,z);a.castShadow=true;group.add(a);return a}function group(x,z){let g=new THREE.Group();g.position.set(x,0,z);scene.add(g);return g}function hotspot(obj,name){obj.userData.item=name;clickable.push(obj)}
box(0,-.12,0,12,.22,9,M.floor); // back rooms, front public space
// perimeter and internal partitions; front wall deliberately absent for dollhouse view
box(-6,.9,0,.13,1.8,9,M.wall);box(6,.9,0,.13,1.8,9,M.wall);box(0,.9,-4.5,12,1.8,.13,M.wall);
box(0,.9,-2,.12,1.8,5,M.wall);box(-3,.9,.25,.12,1.8,4.2,M.wall);box(3,.9,.25,.12,1.8,4.2,M.wall);
// main bedroom back left
box(-3.9,.24,-3.2,2.5,.35,1.7,M.white);box(-3.9,.48,-3.2,2.4,.15,1.6,M.sage);box(-5.08,.66,-3.2,.15,.55,1.7,M.wood);box(-2.72,.48,-3.2,.1,.24,1.7,M.wood);
// second bedroom back right
box(3.6,.27,-3.3,2.1,.42,1.35,M.white);box(3.6,.54,-3.3,2,.13,1.25,M.fabric);box(4.9,.3,-2.6,.65,.6,.6,M.wood);
// living sofa and coffee table
box(-1.3,.28,2.8,2.7,.5,.85,M.fabric);box(-1.3,.63,3.16,2.7,.55,.17,M.fabric);box(-1.3,.22,1.35,1.35,.35,.8,M.wood);
// kitchen right middle
box(4.65,.4,.2,2.25,.8,.65,M.wood);box(4.65,.85,.2,2.25,.12,.7,M.white);box(4.75,.92,.2,.7,.025,.4,M.grey);
// bathroom left middle
box(-4.5,.08,.1,2.6,.08,2.5,M.bath);box(-5.05,.3,-.55,.65,.5,.65,M.white);box(-4.98,.65,-.55,.58,.12,.55,M.white);box(-4.65,.35,1,.7,.65,.5,M.white);box(-5.55,.8,.1,.08,.08,1.4,M.grey);
// doorway and entry ramp
box(4.75,.04,3.9,1.6,.08,.75,M.grey);
// wheelchair, orange accented clickable object
const wc=group(.8,2.2);let wheel1=new THREE.Mesh(new THREE.TorusGeometry(.39,.055,10,30),M.dark);wheel1.rotation.y=Math.PI/2;wheel1.position.set(-.47,.48,0);wc.add(wheel1);let wheel2=wheel1.clone();wheel2.position.x=.47;wc.add(wheel2);box(0,.8,0,.9,.12,.7,M.orange,wc);box(0,1.18,.34,.9,.72,.12,M.dark,wc);box(0,.55,-.35,.8,.08,.22,M.grey,wc);hotspot(wc,'輪椅');
// shower chair
const sc=group(-4.1,.5);box(0,.55,0,.7,.12,.65,M.orange,sc);box(0,.95,.29,.7,.65,.09,M.white,sc);for(let x of [-.27,.27])for(let z of [-.24,.24])cyl(x,.28,z,.045,.52,M.grey,sc);hotspot(sc,'洗澡椅');
// bed marker on care bed
const bed=group(-3.9,-3.2);box(0,.67,0,1.6,.12,.85,M.orange,bed);hotspot(bed,'居家照顧床');
// walker
const walker=group(1.85,.2);for(let x of [-.34,.34]){cyl(x,.48,-.3,.035,.95,M.grey,walker);cyl(x,.48,.3,.035,.95,M.grey,walker)}box(0,.93,-.3,.75,.06,.06,M.orange,walker);hotspot(walker,'助行器');
// labels via sprites
function label(g,s){let c=document.createElement('canvas');c.width=256;c.height=70;let x=c.getContext('2d');x.fillStyle='#fffaf0';x.beginPath();x.roundRect(0,0,256,70,18);x.fill();x.fillStyle='#825b40';x.font='bold 30px sans-serif';x.textAlign='center';x.fillText(s,128,46);let tex=new THREE.CanvasTexture(c);let sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthTest:false}));sp.scale.set(1.5,.41,1);sp.position.set(0,1.9,0);g.add(sp)}label(wc,'輪椅');label(sc,'洗澡椅');label(bed,'照顧床');label(walker,'助行器');
const content={'輪椅':['協助行走能力受限者移動，須依身形、操作能力及使用環境選擇適當款式。','評估座寬、座深、姿勢支持、轉位能力與居家動線。'],'洗澡椅':['讓站立不穩或容易疲倦者坐姿沐浴，降低長時間站立需求。','確認止滑、座面穩定、坐下起身能力及浴室地面條件。'],'居家照顧床':['提供照顧所需的床面調整功能，協助臥床者照顧與移位。','須評估使用者功能、照顧者操作能力、空間及實際需求。'],'助行器':['提供行走時額外支撐，適合經評估可使用此類步行輔具者。','注意高度調整、握力、步態及使用方式。']};
function showItem(name){let c=content[name];document.getElementById('info').innerHTML=`<span class="tag">輔具衛教 · 示範資料</span><h2>${name}</h2><strong>它可以幫助什麼？</strong><p>${c[0]}</p><strong>研編小提醒</strong><div class="pill">${c[1]}</div><strong>補助與商品</strong><p class="muted">正式版將依官方資料顯示碼別、適用資格及補助金額，並可連結合作廠商商品。此版尚未上架及啟用購物車。</p>`}
const views=[['全屋',[13,13,16],[0,0,0]],['客廳',[3.6,5.2,8.4],[0,0,2]],['主臥室',[-6,5,0],[-3.9,0,-3.2]],['次臥室',[6,5,-.4],[3.6,0,-3.3]],['浴室',[-7,5,3],[-4.4,0,.2]],['廚房',[8,5,4],[4.6,0,.2]],['玄關',[8,5,9],[4.5,0,3]]];let desiredPosition=camera.position.clone(),desiredTarget=controls.target.clone(),moving=false;controls.addEventListener('start',()=>{moving=false});const buttons=document.getElementById('rooms');views.forEach(([name,pos,target],i)=>{let b=document.createElement('button');b.textContent=name;if(i===0)b.classList.add('active');b.onclick=()=>{document.querySelectorAll('.rooms button').forEach(e=>e.classList.remove('active'));b.classList.add('active');desiredPosition.set(...pos);desiredTarget.set(...target);moving=true};buttons.appendChild(b)});
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let start;renderer.domElement.addEventListener('pointerdown',e=>start=[e.clientX,e.clientY]);renderer.domElement.addEventListener('pointerup',e=>{if(!start||Math.hypot(e.clientX-start[0],e.clientY-start[1])>8)return;let rect=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1);ray.setFromCamera(mouse,camera);let hits=ray.intersectObjects(clickable,true);if(hits.length){let obj=hits[0].object;while(obj&&!obj.userData.item)obj=obj.parent;if(obj)showItem(obj.userData.item)}});
function resize(){let w=mount.clientWidth,h=mount.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)}new ResizeObserver(resize).observe(mount);resize();function animate(){requestAnimationFrame(animate);if(moving){camera.position.lerp(desiredPosition,.075);controls.target.lerp(desiredTarget,.075);if(camera.position.distanceTo(desiredPosition)<.04&&controls.target.distanceTo(desiredTarget)<.04)moving=false}controls.update();renderer.render(scene,camera)}animate();
